name: Mantener activa la base de datos

# El plan gratuito de Supabase pausa el proyecto tras ~7 días sin actividad.
# Esta consulta liviana (solo lectura, sin credenciales privadas) lo mantiene
# activo aunque nadie use la app por un tiempo.
on:
  schedule:
    - cron: '0 12 * * 1,4' # lunes y jueves 12:00 UTC
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consulta liviana a Supabase (REST)
        # La misma clave publicable que usa la app en js/config.js (protegida por RLS).
        # existen_cuentas() es la única consulta abierta sin sesión (solo devuelve true/false).
        run: |
          curl -sf \
            -H "apikey: sb_publishable_tAabqx6C574v8-1ZD2_Jmw_Y6WUB7DP" \
            -X POST -H "Content-Type: application/json" -d "{}" \
            "https://isbpfyeoilznnnywcxhx.supabase.co/rest/v1/rpc/existen_cuentas"
